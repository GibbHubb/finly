name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt   # F34 - list lives at the repo root now
      - run: pip install -r ../requirements.txt   # F34 - step runs in backend/
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./test.db
          PYTHONPATH: .
      - name: Run pytest
        env:
          PYTHONPATH: .
        run: set -o pipefail && pytest tests/ -v --tb=short 2>&1 | tee pytest-output.txt

      # F34 — put the failure where it can be READ without a token.
      #
      # GitHub's job-log API answers 403 to an unauthenticated caller, so a red
      # tick is all anyone outside the repo can see, and "CI is failing" becomes
      # a fact nobody can act on. The step summary IS exposed on the check-run,
      # so the tail of a failed run lands somewhere legible.
      - name: Report the failure as annotations
        if: failure()
        run: |
          echo '### Failed step output (tail)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 pytest-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # $GITHUB_STEP_SUMMARY is NOT exposed on the check-run, so it is
          # invisible to anyone without a token. `::error::` becomes an
          # annotation, which the API serves unauthenticated.
          tail -n 25 pytest-output.txt 2>/dev/null | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

name: e2e

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: pip install -r ../requirements.txt   # F34 - step runs in backend/

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_MODE: "1"
          DATABASE_URL: "sqlite:///./e2e.db"
          CI: "true"
        run: set -o pipefail && npm run e2e 2>&1 | tee e2e-output.txt

      # F34 — see the note in ci.yml.
      - name: Report the failure as annotations
        if: failure()
        run: |
          echo '### Failed step output (tail)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 e2e-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # $GITHUB_STEP_SUMMARY is NOT exposed on the check-run, so it is
          # invisible to anyone without a token. `::error::` becomes an
          # annotation, which the API serves unauthenticated.
          tail -n 25 e2e-output.txt 2>/dev/null | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

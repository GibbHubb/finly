name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r ../requirements.txt   # F34 - list lives at the repo root now

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: |
          cd backend
          set -o pipefail && pytest --tb=short 2>&1 | tee pytest-output.txt

      # F34 — see the note in ci.yml: the log API is 403 to an unauthenticated
      # caller, so a failure has to say what it was somewhere readable.
      - name: Report the failure in the job summary
        if: failure()
        run: |
          echo '### Failed step output (tail)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 backend/pytest-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo '(nothing captured)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    # F47 — the ratchet. coverage.py's TOTAL with branch=True (lines and branches blended).
    # Measured 2026-10-01: 90.41% (lines 92.69, branches 80.32). Set a point under that
    # (the floor must hold on 3.11 and 3.12 too). Only ever raise it; ci.yml gates lines (91)
    # and branches (79) separately via scripts/coverage_floor.py.
    --cov-fail-under=89
filterwarnings =
    ignore::DeprecationWarning

# F61 — mypy at a NON-strict baseline, report-only in CI (ci.yml `continue-on-error`).
# Baseline 2026-10-02 (mypy 2.4.0, this file): 20 errors in 7 files —
#   6  name-defined: SQLAlchemy relationship annotations naming other models as strings
#   10 main.py: `import app.models.x` binds the name `app` to the package, then
#      `app = FastAPI(...)` rebinds it; works at runtime, but mypy types every later `app.` as
#      the module. Fix by aliasing the model imports — a follow-up, not done here.
#   3  transactions.py: `budget_alerts` is set on the ORM object as an ad-hoc attribute
#   1  rates_service.py: the two dialect `insert` imports share one name
# Make it blocking (delete continue-on-error) once those are 0; strict is a separate step.
[mypy]
python_version = 3.11
ignore_missing_imports = True
files = app
